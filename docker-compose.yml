services:
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./site:/app
      - ./standard:/app/../standard:ro
      - ./guide:/app/../guide:ro
      - ./reference:/app/../reference:ro
      - senar_modules:/app/node_modules
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

volumes:
  senar_modules:
