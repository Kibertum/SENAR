server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Custom 404 page
    error_page 404 /404.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://mc.yandex.ru data:; connect-src 'self' https://www.google-analytics.com https://mc.yandex.ru https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;" always;

    # Root: 301 to /en/ (default language for bots and users)
    location = / {
        return 301 /en/;
    }

    # Astro static assets — cache 1 year
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static i18n routes — try exact file, then 404
    location /en/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /ru/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Text files — UTF-8 charset
    location ~* \.(txt|json)$ {
        charset utf-8;
        charset_types text/plain application/json;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Default fallback
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
